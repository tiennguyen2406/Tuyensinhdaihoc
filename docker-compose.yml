name: eduradar-handover

x-python: &python
  image: eduradar-api:local
  build:
    context: .
    dockerfile: Dockerfile

services:
  postgres:
    image: postgres:17
    shm_size: 512mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eduradar_owner}
      POSTGRES_DB: ${POSTGRES_DB:-eduradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  init:
    <<: *python
    command: ["python", "-m", "scripts.docker_bootstrap"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-eduradar_owner}
      POSTGRES_DB: ${POSTGRES_DB:-eduradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-eduradar_app_reader}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *python
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-eduradar}
      # The long-running API never receives migration-owner credentials.
      POSTGRES_USER: ${CATALOG_DB_USER:-eduradar_app_reader}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in .env}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-eduradar_app_reader}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in .env}
      CATALOG_CURSOR_SECRET: ${CATALOG_CURSOR_SECRET:?Set CATALOG_CURSOR_SECRET in .env}
      CRAWLER_RAW_DIR: /app/state/raw
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    image: eduradar-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/majors').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
