[project]
name = "tuyensinhdaihoc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "beautifulsoup4>=4.13,<5",
    "fastapi[standard]>=0.143.3",
    "pdfplumber>=0.11,<1",
    "protego>=0.6.2,<1",
    "psutil>=7,<8",
    "psycopg[binary]>=3,<4",
    "python-dotenv>=1,<2",
    "sqlalchemy[asyncio]>=2,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.16,<2",
    "pytest>=8,<10",
    "reportlab>=4,<5",
    "ruff>=0.12,<1",
    "types-psutil>=7.2.2.20260906",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "services"
module-root = ""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["services"]
check_untyped_defs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
