[project]
name = "tuyensinhdaihoc"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.1.0",
    "networkx==3.7",
    "matplotlib==3.11.2",
    "scipy==1.18.1",
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "python-docx==1.2.0",
    "pypandoc_binary==1.17",
]

[dependency-groups]
dev = [
    "ruff==0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
